---
layout: default
---

<section class="page-hero{% unless page.image %} page-hero--plain{% endunless %}">
  {% if page.image %}
  <img class="page-hero__image" src="{{ page.image | relative_url }}" alt="" fetchpriority="high">
  {% endif %}
  <div class="page-hero__content">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1 class="page-hero__title">{{ page.title }}</h1>
    {% if page.lead %}<p class="page-hero__lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<article class="prose">
  {{ content }}
</article>
