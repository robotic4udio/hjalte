#-------------------------------
# General Site Settings
baseurl: "/hjalte" # The subpath of your site, e.g. /blog
url: "https://roboticaudio.com" # The base hostname & protocol for your site, e.g. http://example.com


#-------------------------------
# Build settings
markdown: kramdown
permalink: /blog/:title/ # Blog posts (_posts/) live under /blog/
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Projects live in _projects/ and keep the short addresses they always had: /<file-name>
collections:
  projects:
    output: true
    permalink: /:title

defaults:
  - scope:
      path: '_pages'
    values:
      layout: page
      permalink: /:basename:output_ext
  - scope:
      path: ''
      type: projects
    values:
      layout: project
  - scope:
      path: ''
      type: posts
    values:
      layout: post
  - scope:
      path: '_drafts'
    values:
      layout: post

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - tools
