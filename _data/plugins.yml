# The Robotic Audio plugins shown on the front page, in this order.
# image: a picture of the plugin's window, in images/plugins/.
- name: Contour
  kind: Bass synth
  text: A gnarly wobble-bass synth where you draw the movement. Paint how each note's volume, pitch and tone change over time, then push it through a drive section, fourteen filters and a full effects rack.
  image: '/images/plugins/contour.jpg'

- name: Echo Engine
  kind: Delay
  text: Clean, tape and lo-fi echoes, single, dual or ping-pong, free or locked to the tempo. Diffusion turns them into clouds, and pitch-shifted repeats climb into shimmer.
  image: '/images/plugins/echo-engine.jpg'

- name: Overpressure
  kind: Compressor & drive
  text: A hardware-style compressor with four stages of dirt behind it. Saturation, overdrive, distortion and fuzz, from gentle glue to a smashed drum bus.
  image: '/images/plugins/overpressure.jpg'

- name: Reverser
  kind: Live reverse
  text: Keeps the last moments of whatever you play and throws them back in reverse. Hold a button and the audio runs backwards, at normal or double speed.
  image: '/images/plugins/reverser.jpg'
