#-------------------------------
# What I do (front page). Each card links to the Projects page filtered by its tag.
services:
  - icon: "fa-solid fa-music"
    title: Music & sound design
    text: Music for theatre, podcasts and art installations, with atmospheric soundscapes that carry the story.
    tag: Composition
  - icon: "fa-solid fa-tower-broadcast"
    title: Sound installations
    text: Interactive works where the audience becomes part of the piece, driven by sensors, cameras and code.
    tag: Art
  - icon: "fa-solid fa-robot"
    title: Instruments & creative tech
    text: Robotic instruments, sensor interfaces and custom audio software, built with Bela, Max and C++.
    tag: Creative-Tech
  - icon: "fa-solid fa-chalkboard-user"
    title: Teaching & workshops
    text: Courses and workshops on building instruments, designing interfaces and experimenting with sound.
    tag: Teaching


